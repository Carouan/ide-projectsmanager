name: Publish stable release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
      - CHANGELOG.md
      - docs/releases/**
      - package.json
      - package-lock.json
      - scripts/release/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source quality
        run: npm run lint

      - name: Run complete automated suite
        run: npm test

      - name: Build installable web application
        run: npm run build

      - name: Create ZIP archive and SHA-256 checksum
        run: npm run package:release

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          archive="release/ide-projectsmanager-${tag}-web.zip"
          checksum="${archive}.sha256"
          notes="docs/releases/${tag}.md"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; published assets are left unchanged."
            exit 0
          fi

          gh release create "$tag" "$archive" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IDE Projects Manager ${tag}" \
            --notes-file "$notes"
